<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sons LVSP</title>
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/android/mipmap-xxxhdpi/ic_launcher.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/playstore.png">
</head>

<body>
    <div class="offline-banner">MODE HORS-LIGNE</div>

    <header>
        <h1>Régie Sons LVSP</h1>
        <div class="status-info">
            <span id="conn-status">Vérification réseau...</span>
            <span id="app-version">v1.0.4</span>
        </div>
        <div class="status-info" style="margin-top: 0.5rem; font-size: 0.7rem;">
            <span id="last-update">Dernier rafraîchissement : --/--</span>
            <span id="update-btn" onclick="forceUpdate()"
                style="cursor:pointer; text-decoration:underline; font-weight:600; color:var(--accent); margin-left: 1rem;">Rafraîchir
                l'app</span>
        </div>
    </header>

    <main id="soundboard" class="sound-grid">
        <!-- Tiles will be generated here -->
    </main>

    <footer id="cache-ui" class="cache-footer">
        <p id="cache-msg" style="font-size: 0.8rem;">Préparation du mode hors-ligne...</p>
        <div class="progress-bar-bg">
            <div id="cache-fill"></div>
        </div>
    </footer>

    <script src="playlist.js"></script>
    <script src="app.js"></script>
</body>

</html>
